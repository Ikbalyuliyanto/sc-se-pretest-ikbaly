<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess Lonely Knight</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <h1>Chess Lonely Knight</h1>

        <form id="boardForm" class="controls">

            <div class="input-group">
                <label for="row">Row</label>

                <input
                    type="number"
                    id="row"
                    value="8"
                    min="1"
                    max="100"
                >
            </div>

            <div class="input-group">
                <label for="column">Column</label>

                <input
                    type="number"
                    id="column"
                    value="8"
                    min="1"
                    max="100"
                >
            </div>

            <button type="submit" id="generateButton">
                Generate Board
            </button>

        </form>


        <!-- Komponen Board -->

        <chess-board id="board"></chess-board>

    </div>


    <script src="script.js"></script>

</body>

</html>
